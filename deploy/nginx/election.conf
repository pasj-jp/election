upstream election_gunicorn {
    server unix:/run/election/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name vote.pasj.jp;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name vote.pasj.jp;

    # 実際の証明書パスへ変更する。
    ssl_certificate /etc/letsencrypt/live/vote.pasj.jp/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vote.pasj.jp/privkey.pem;

    client_max_body_size 2m;

    location /static/ {
        alias /opt/election/src/staticfiles/;
        access_log off;
        expires 1h;
    }

    # 投票tokenをNginxのaccess logへ残さない。
    location ~ ^/v/[^/]+/$ {
        access_log off;
        proxy_pass http://election_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://election_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

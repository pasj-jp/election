{% extends "election/auth/base.html" %}
{% block auth_title %}メールをご確認ください{% endblock %}
{% block auth_content %}
<h1 id="auth-heading">メールをご確認ください</h1>
<p>入力されたメールアドレスに有効なアカウントが登録されている場合、再設定用のメールを送信しました。</p><p>メール内のリンクから新しいパスワードを設定してください。届かない場合は、迷惑メールフォルダーと登録メールアドレスをご確認ください。</p><p class="auth-links"><a href="{% url 'election:login' %}">ログイン画面へ戻る</a></p>
{% endblock %}

{% extends "election/auth/base.html" %}
{% block auth_title %}パスワードの再設定{% endblock %}
{% block auth_content %}
<h1 id="auth-heading">パスワードの再設定</h1>
<p>管理用アカウントに登録したメールアドレスを入力してください。パスワード再設定用のリンクをお送りします。</p><form method="post">{% csrf_token %}
{% include "election/auth/fields.html" %}
<button class="button primary auth-submit" type="submit">再設定用メールを送信</button>
</form><p class="auth-links"><a href="{% url 'election:login' %}">ログイン画面へ戻る</a></p>
{% endblock %}

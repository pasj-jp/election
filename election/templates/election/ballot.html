<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{{ election }}</title>
</head>

<body>

<h1>{{ election }}</h1>

{% if election.office == "representative" %}

<p>
    本選挙に推薦する会員を
    最大10名まで選択してください。
</p>

<p>
    選択人数:
    <strong id="selected-count">0</strong>
    / 10
</p>

{% endif %}


<form
    method="post"
    action="{% url 'election:ballot_confirm' %}"
>

    {% csrf_token %}

    {% for candidate in candidates %}

        <div>

            <label>

                <input
                    type="checkbox"
                    name="candidate"
                    value="{{ candidate.pk }}"
                    class="candidate-checkbox"
                >

                {{ candidate.member.last_name }}
                {{ candidate.member.first_name }}

                {% if candidate.member.representative_category == "corporate" %}
                    【企業枠】
                {% else %}
                    【一般枠】
                {% endif %}

                {% if candidate.member.affiliation %}
                    -
                    {{ candidate.member.affiliation }}
                {% endif %}

            </label>

        </div>

    {% empty %}

        <p>
            候補者が登録されていません。
        </p>

    {% endfor %}

    <p>
        <button type="submit">
            投票内容を確認
        </button>
    </p>

</form>


<script>
document.addEventListener("DOMContentLoaded", function () {

    const checkboxes =
        document.querySelectorAll(
            ".candidate-checkbox"
        );

    const counter =
        document.getElementById(
            "selected-count"
        );

    function updateCount() {

        const checked =
            document.querySelectorAll(
                ".candidate-checkbox:checked"
            );

        counter.textContent =
            checked.length;

        checkboxes.forEach(function (checkbox) {

            if (
                checked.length >= 10
                && !checkbox.checked
            ) {
                checkbox.disabled = true;
            } else {
                checkbox.disabled = false;
            }

        });
    }

    checkboxes.forEach(
        function (checkbox) {

            checkbox.addEventListener(
                "change",
                updateCount
            );

        }
    );

    updateCount();
});
</script>

</body>
</html>

{% extends "election/voting_base.html" %}

{% block title %}投票セッション無効{% endblock %}
{% block body_class %}centered-page{% endblock %}

{% block content %}
<main class="status-card">
    <div class="status-main">
        <div class="status-icon status-icon--warning" aria-hidden="true">!</div>
        <p class="eyebrow">SESSION EXPIRED</p>
        <h1>投票ページを開けません</h1>
        <p class="error-message">投票セッションが無効、または期限切れです。</p>
    </div>
    <div class="status-note">
        <p>メールに記載された専用の投票URLから、もう一度アクセスしてください。</p>
    </div>
</main>
{% endblock %}
